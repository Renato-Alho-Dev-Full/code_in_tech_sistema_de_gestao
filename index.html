
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Code_in_tech — Sistema Integrado ERP, PDV & CRM (Cloud)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-base: #09090B;
      --bg-surface: #121216;
      --bg-elevated: #1C1C21;
      --bg-hover: #27272A;
      --border: #27272A;
      --border-strong: #3F3F46;
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
      --blue: #2563EB;
      --blue-hover: #1D4ED8;
      --blue-soft: rgba(37, 99, 235, 0.14);
      --red: #DC2626;
      --red-hover: #B91C1C;
      --red-soft: rgba(220, 38, 38, 0.14);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
      --radius: 12px;
      --radius-sm: 8px;
      --parallax-y: 0px;
    }

    html[data-theme="light"] {
      --bg-base: #F4F4F5;
      --bg-surface: #FFFFFF;
      --bg-elevated: #F8FAFC;
      --bg-hover: #E4E4E7;
      --border: #E4E4E7;
      --border-strong: #D4D4D8;
      --text-primary: #09090B;
      --text-secondary: #52525B;
      --text-muted: #71717A;
      --blue-soft: rgba(37, 99, 235, 0.1);
      --red-soft: rgba(220, 38, 38, 0.1);
      --shadow-sm: 0 2px 8px rgba(9, 9, 11, 0.06);
      --shadow-lg: 0 16px 40px rgba(9, 9, 11, 0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%; overflow-x: hidden;
      background-color: var(--bg-base); color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .parallax-bg {
      position: fixed; inset: -60px 0 0 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(600px circle at 15% 10%, rgba(37, 99, 235, 0.09), transparent 55%),
        radial-gradient(500px circle at 85% 80%, rgba(220, 38, 38, 0.06), transparent 55%);
      transform: translate3d(0, var(--parallax-y), 0);
    }
    @media (prefers-reduced-motion: reduce) { .parallax-bg { transform: none !important; } }

    .hidden { display: none !important; }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-blue { color: var(--blue); }
    .text-red { color: var(--red); }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .fw-600 { font-weight: 600; }
    .fw-700 { font-weight: 700; }
    .w-full { width: 100%; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 42px; padding: 0 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary);
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
    .btn-primary:hover:not(:disabled) { background: var(--blue-hover); border-color: var(--blue-hover); }
    .btn-danger { background: var(--red); border-color: var(--red); color: #FFFFFF; }
    .btn-danger:hover:not(:disabled) { background: var(--red-hover); border-color: var(--red-hover); }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); }
    .btn-sm { min-height: 34px; padding: 0 11px; font-size: 13px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .input, .select, .textarea {
      width: 100%; min-height: 42px; padding: 9px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-base); color: var(--text-primary);
      font-size: 14px; font-family: inherit; transition: border-color 0.18s, box-shadow 0.18s;
    }
    .textarea { min-height: 84px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
      font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-secondary);
    }
    .badge-blue { background: var(--blue-soft); border-color: rgba(37, 99, 235, 0.35); color: var(--blue); }
    .badge-red { background: var(--red-soft); border-color: rgba(220, 38, 38, 0.35); color: var(--red); }

    .card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm);
    }
    .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

    #login-view {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px;
    }
    .login-top-bar { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .login-card {
      width: 100%; max-width: 440px; background: var(--bg-surface);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow-lg);
    }
    .logo-center-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-bottom: 20px; }

    #app-view { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(18, 18, 22, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 10px 16px;
    }
    html[data-theme="light"] .topbar { background: rgba(255, 255, 255, 0.9); }
    .topbar-inner { max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-center { display: flex; justify-content: center; align-items: center; }
    .topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    @media (max-width: 680px) {
      .topbar-inner { grid-template-columns: auto 1fr auto; }
      .hide-mobile { display: none !important; }
    }

    .hero-banner { background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-elevated) 100%); border-bottom: 1px solid var(--border); padding: 18px 16px; }
    .hero-inner { max-width: 1360px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

    .nav-tabs-wrap { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
    .nav-tabs-wrap::-webkit-scrollbar { display: none; }
    .nav-tabs { max-width: 1360px; margin: 0 auto; display: flex; gap: 6px; padding: 8px 0; }
    .tab-btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: var(--radius-sm);
      border: 1px solid transparent; background: transparent; color: var(--text-secondary);
      font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.16s ease;
    }
    .tab-btn:hover { color: var(--text-primary); background: var(--bg-elevated); }
    .tab-btn.active { background: var(--blue-soft); color: var(--blue); border-color: rgba(37, 99, 235, 0.35); }

    .main-container { width: 100%; max-width: 1360px; margin: 0 auto; padding: 20px 16px 80px; flex: 1; }

    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-surface); }
    table { width: 100%; border-collapse: collapse; min-width: 620px; }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    th { background: var(--bg-elevated); color: var(--text-secondary); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }

    .pdv-layout { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
    .pdv-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; margin-top: 12px; }
    .product-tile {
      display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
      padding: 12px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--bg-surface); text-align: left; cursor: pointer; color: var(--text-primary);
    }
    .product-tile:hover:not(:disabled) { border-color: var(--blue); transform: translateY(-1px); }
    .product-tile:disabled { opacity: 0.42; cursor: not-allowed; }
    .pdv-cart-sticky { position: sticky; top: 84px; }
    .cart-item { border: 1px solid var(--border); background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 10px; }
    .mobile-pdv-bar { display: none; }
    @media (max-width: 960px) {
      .pdv-layout { grid-template-columns: 1fr; }
      .pdv-cart-sticky { position: static; }
      .mobile-pdv-bar {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 10px 16px; background: var(--bg-surface); border-top: 1px solid var(--border); box-shadow: var(--shadow-lg);
      }
    }

    .chart-box { width: 100%; overflow-x: auto; padding-top: 8px; }
    .period-pills { display: inline-flex; background: var(--bg-base); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; gap: 3px; flex-wrap: wrap; }
    .period-pill { border: none; background: transparent; color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .period-pill.active { background: var(--blue); color: #FFFFFF; }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(9, 9, 11, 0.72);
      backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow-lg); }

    #toast-container { position: fixed; top: 16px; right: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; max-width: 340px; }
    .toast { padding: 12px 14px; border-radius: var(--radius-sm); background: var(--bg-surface); border: 1px solid var(--border); border-left: 4px solid var(--blue); box-shadow: var(--shadow-lg); font-size: 13.5px; font-weight: 500; }
    .toast.error { border-left-color: var(--red); }

    #print-area { display: none; }
    @media print {
      body { background: #FFFFFF !important; color: #09090B !important; }
      #login-view, #app-view, #toast-container, .modal-backdrop, .parallax-bg { display: none !important; }
      #print-area { display: block !important; padding: 16px; color: #09090B; font-family: Arial, Helvetica, sans-serif; }
      #print-area table { width: 100%; border-collapse: collapse; min-width: 0; margin-top: 12px; }
      #print-area th, #print-area td { border: 1px solid #D4D4D8; padding: 7px 9px; font-size: 11.5px; color: #09090B; }
      #print-area th { background: #F4F4F5 !important; }
    }
  </style>
</head>
<body>
  <div class="parallax-bg"></div>
  <div id="toast-container"></div>

  <!-- LOGIN -->
  <section id="login-view">
    <div class="login-top-bar">
      <button class="btn btn-sm" type="button" onclick="openSupabaseSetupModal()" id="sb-status-btn">Configurar Banco</button>
      <button class="btn btn-sm" type="button" onclick="toggleTheme()" id="theme-btn-login">Tema: Escuro</button>
    </div>

    <div class="login-card">
      <div class="logo-center-wrap" id="login-logo-slot"></div>

      <div style="text-align:center; margin-bottom: 18px;">
        <h1 style="font-size: 20px; font-weight: 700;">Acesso ao Sistema</h1>
        <p class="text-muted" style="font-size: 13px; margin-top: 4px;">
          Autenticação em nuvem via Supabase. Entre para acessar seu painel exclusivo.
        </p>
      </div>

      <div id="login-alert" class="hidden" style="margin-bottom:14px; padding:10px 12px; border-radius:8px; background:var(--red-soft); border:1px solid rgba(220,38,38,0.35); color:var(--red); font-size:13px;"></div>

      <form onsubmit="handleLogin(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">E-mail corporativo</label>
          <input class="input" id="login-email" type="email" placeholder="usuario@codeintech.com" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Senha</label>
          <input class="input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary w-full" type="submit" id="login-submit-btn">Entrar no Sistema</button>
      </form>
    </div>
  </section>

  <!-- APP -->
  <section id="app-view" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <span class="badge badge-blue" id="header-role-badge">Perfil</span>
          <span class="text-secondary hide-mobile" style="font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" id="header-user-name"></span>
        </div>

        <div class="topbar-center" id="topbar-logo-slot"></div>

        <div class="topbar-right">
          <button class="btn btn-sm" type="button" onclick="syncAllData(true)">Atualizar</button>
          <button class="btn btn-sm" type="button" onclick="toggleTheme()" id="theme-btn-app">Tema</button>
          <button class="btn btn-sm btn-danger" type="button" onclick="logout()">Sair</button>
        </div>
      </div>
    </header>

    <div class="hero-banner">
      <div class="hero-inner">
        <div>
          <h2 id="hero-title" style="font-size:19px; font-weight:700;">Painel</h2>
          <p id="hero-subtitle" class="text-secondary" style="font-size:13px;"></p>
        </div>
        <div class="badge font-mono" id="hero-route-badge">#rota</div>
      </div>
    </div>

    <nav class="nav-tabs-wrap">
      <div class="nav-tabs" id="nav-tabs"></div>
    </nav>

    <main class="main-container" id="main-content"></main>
  </section>

  <div id="modal-root" class="modal-backdrop hidden" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modal-box"></div>
  </div>

  <div id="print-area"></div>

<script>
(() => {
  'use strict';

  /* =========================================================
     CONFIGURAÇÃO DO SUPABASE (COLE SUAS CHAVES AQUI)
     ========================================================= */
  const DEFAULT_SUPABASE_URL = 'COLE_SUA_PROJECT_URL_AQUI';
  const DEFAULT_SUPABASE_ANON_KEY = 'COLE_SUA_ANON_KEY_AQUI';

  const SB_CFG_KEY = 'codeintech_supabase_cfg';
  const THEME_KEY = 'codeintech_theme';
  const LOCK_KEY = 'codeintech_login_lock';

  function getSupabaseConfig() {
    if (!DEFAULT_SUPABASE_URL.startsWith('COLE_') && !DEFAULT_SUPABASE_ANON_KEY.startsWith('COLE_')) {
      return { url: DEFAULT_SUPABASE_URL.trim(), key: DEFAULT_SUPABASE_ANON_KEY.trim() };
    }
    try {
      const saved = JSON.parse(localStorage.getItem(SB_CFG_KEY) || '{}');
      if (saved.url && saved.key) return saved;
    } catch {}
    return { url: '', key: '' };
  }

  let sb = null;
  function initSupabaseClient() {
    const cfg = getSupabaseConfig();
    const btn = document.getElementById('sb-status-btn');
    if (cfg.url && cfg.key && window.supabase) {
      sb = window.supabase.createClient(cfg.url, cfg.key);
      if (btn) { btn.textContent = 'Banco: Conectado'; btn.className = 'btn btn-sm badge-blue'; }
      return true;
    }
    sb = null;
    if (btn) { btn.textContent = 'Configurar Banco'; btn.className = 'btn btn-sm badge-red'; }
    return false;
  }

  window.openSupabaseSetupModal = function () {
    const cfg = getSupabaseConfig();
    openModal(`
      <h3 style="font-size:17px; font-weight:700; margin-bottom:10px;">Conexão com Supabase (PostgreSQL)</h3>
      <p class="text-muted" style="font-size:13px; margin-bottom:14px;">
        Cole a <strong>Project URL</strong> e a <strong>Anon Key</strong> do painel do Supabase (Project Settings → API).
      </p>
      <form onsubmit="saveSupabaseSetup(event)">
        <div class="form-group">
          <label class="form-label">Project URL*</label>
          <input class="input font-mono" id="cfg-sb-url" required placeholder="https://seuprojeto.supabase.co" value="${escapeHTML(cfg.url)}" />
        </div>
        <div class="form-group">
          <label class="form-label">Anon / Publishable Key*</label>
          <input class="input font-mono" id="cfg-sb-key" required placeholder="eyJhbGci..." value="${escapeHTML(cfg.key)}" />
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Conectar Banco</button>
        </div>
      </form>
    `);
  };

  window.saveSupabaseSetup = function (e) {
    e.preventDefault();
    const url = document.getElementById('cfg-sb-url').value.trim().replace(/\/$/, '');
    const key = document.getElementById('cfg-sb-key').value.trim();
    if (!url.startsWith('https://') || key.length < 20) return toast('URL ou Chave inválida.', 'error');
    localStorage.setItem(SB_CFG_KEY, JSON.stringify({ url, key }));
    initSupabaseClient();
    closeModal();
    toast('Conexão com Supabase configurada!');
  };

  /* =========================================================
     LOGO CENTRALIZADA & UTILITÁRIOS
     ========================================================= */
  function getLogoHTML(compact = false) {
    if (compact) {
      return `
        <div style="display:flex; align-items:center; justify-content:center; gap:9px;">
          <svg width="36" height="36" viewBox="0 0 120 120" aria-label="Logo Code_in_tech">
            <defs><linearGradient id="citGradSm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4AD8E6"/><stop offset="100%" stop-color="#0847A8"/></linearGradient></defs>
            <rect width="120" height="120" rx="22" fill="url(#citGradSm)"/>
            <path d="M60 18c-12 0-22 14-22 25 0 7 3 12 8 15l-13 11c-6 6-5 16 4 19h46c9-3 10-13 4-19L74 58c5-3 8-8 8-15 0-11-10-25-22-25z" fill="#FFFFFF"/>
            <path d="M44 43c4-5 28-5 32 0 1 5-1 12-5 14H49c-4-2-6-9-5-14z" fill="#27323F"/>
            <rect x="33" y="54" width="54" height="34" rx="4" fill="#38BDF8"/>
            <rect x="36" y="57" width="48" height="28" rx="2" fill="#5CE1E6"/>
            <polygon points="60,61 70,66 60,71 50,66" fill="#EF4444"/>
            <polygon points="50,66 60,71 60,81 50,76" fill="#65A30D"/>
            <polygon points="70,66 60,71 60,81 70,76" fill="#F59E0B"/>
            <rect x="29" y="88" width="62" height="7" rx="3.5" fill="#38BDF8"/>
          </svg>
          <div style="text-align:left; line-height:1.1;">
            <div style="font-weight:800; font-size:16px; letter-spacing:-0.02em;">Code_in_tech</div>
            <div style="font-size:9px; letter-spacing:0.18em; color:var(--text-muted); font-weight:700;">SOLUÇÕES EM T.I.</div>
          </div>
        </div>
      `;
    }
    return `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;">
        <div style="width:128px; height:128px; border-radius:24px; overflow:hidden; box-shadow:0 10px 28px rgba(37,99,235,0.28); border:1px solid rgba(255,255,255,0.12);">
          <svg viewBox="0 0 200 200" width="128" height="128" aria-label="Logo Code_in_tech">
            <defs><linearGradient id="citGradLg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4AD8E6"/><stop offset="100%" stop-color="#0847A8"/></linearGradient></defs>
            <rect width="200" height="200" fill="url(#citGradLg)"/>
            <path d="M100 26c-17 0-32 22-32 39 0 11 5 18 12 22l-22 18c-9 8-7 24 6 29h72c13-5 15-21 6-29l-22-18c7-4 12-11 12-22 0-17-15-39-32-39z" fill="#FFFFFF"/>
            <path d="M76 62c6-8 42-8 48 0 2 8-2 19-9 23H85c-7-4-11-15-9-23z" fill="#27323F"/>
            <rect x="52" y="79" width="96" height="60" rx="7" fill="#38BDF8"/>
            <rect x="56" y="83" width="88" height="52" rx="4" fill="#5CE1E6"/>
            <polygon points="100,90 112,96 100,102 88,96" fill="#EF4444"/>
            <polygon points="82,99 98,107 98,125 82,117" fill="#DC2626"/>
            <polygon points="118,99 102,107 102,125 118,117" fill="#0284C7"/>
            <polygon points="100,102 110,107 100,113 90,107" fill="#F59E0B"/>
            <polygon points="90,107 100,113 100,127 90,121" fill="#84CC16"/>
            <polygon points="110,107 100,113 100,127 110,121" fill="#FBBF24"/>
            <rect x="46" y="139" width="108" height="12" rx="6" fill="#38BDF8"/>
          </svg>
        </div>
        <div style="text-align:center;">

  function escapeHTML(str) {

    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function formatBRL(val) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(val) || 0); }
  function formatDateTime(iso) { return iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'; }
  function formatDate(iso) { return iso ? new Date(iso + (iso.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pt-BR') : '-'; }
  function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(email).trim()); }

    tasks.push(sb.from('products').select('*').order('name').then(r => { if (!r.error) STATE.products = r.data || []; }));

      tasks.push(sb.from('debts').select('*').order('created_at', { ascending: false }).then(r => { if (!r.error) STATE.debts = r.data || []; }));
      tasks.push(sb.from('sales').select('*').order('created_at', { ascending: false }).limit(500).then(r => { if (!r.error) STATE.sales = r.data || []; }));
    }

    // Saídas Financeiras

  /* =========================================================

     ========================================================= */
  function getLockState() { try { return JSON.parse(localStorage.getItem(LOCK_KEY) || '{"fails":0,"until":0}'); } catch { return { fails: 0, until: 0 }; } }
  function setLockState(s) { localStorage.setItem(LOCK_KEY, JSON.stringify(s)); }

  window.handleLogin = async function (e) {
    e.preventDefault();
    const alertEl = document.getElementById('login-alert');
    alertEl.classList.add('hidden');

    if (!sb) {
      openSupabaseSetupModal();
      return toast('Configure primeiro a URL e Chave do Supabase.', 'error');
    }

    const lock = getLockState();
    if (lock.until > Date.now()) {
      alertEl.textContent = `Acesso bloqueado temporariamente. Aguarde ${Math.ceil((lock.until - Date.now()) / 1000)}s.`;
      alertEl.classList.remove('hidden');
      return;
    }

    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    if (!validateEmail(email) || password.length < 4) {
      alertEl.textContent = 'Informe e-mail válido e senha.';
      alertEl.classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('login-submit-btn');
    btn.disabled = true; btn.textContent = 'Autenticando...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Entrar no Sistema';

    if (error || !data.user) {
      lock.fails = (lock.fails || 0) + 1;
      if (lock.fails >= 5) {
        lock.until = Date.now() + 30000; lock.fails = 0;
        alertEl.textContent = '5 tentativas incorretas. Bloqueado por 30 segundos.';
      } else {
        alertEl.textContent = `E-mail ou senha inválidos (${lock.fails}/5).`;
      }
      setLockState(lock);
      alertEl.classList.remove('hidden');
      return;
    }

    const { data: profile, error: profErr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
    if (profErr || !profile || !profile.active) {
      await sb.auth.signOut();
      alertEl.textContent = 'Perfil não encontrado ou usuário bloqueado pelo administrador.';
      alertEl.classList.remove('hidden');
      return;
    }

    setLockState({ fails: 0, until: 0 });
    CURRENT_USER = profile;
    document.getElementById('login-password').value = '';
    await logAuditRemote('LOGIN_SUCESSO', `Login via Supabase Auth (${ROLES[profile.role].route})`, 'info');
    window.location.hash = ROLES[profile.role].route;
    await enterApp();
  };

  /* =========================================================
     DASHBOARD MODERNO (DIÁRIO, SEMANAL, MENSAL, ANUAL)
     ========================================================= */
  function buildFinancialSeries(period) {
    const now = new Date();
    const buckets = [];
    if (period === 'diario') {
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now); d.setDate(now.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        buckets.push({ label: d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }), match: iso => iso.slice(0, 10) === key, inTotal: 0, outTotal: 0 });
      }
    } else if (period === 'semanal') {
      for (let w = 3; w >= 0; w--) {
        const end = new Date(now); end.setHours(23, 59, 59, 999); end.setDate(now.getDate() - w * 7);
        const start = new Date(end); start.setHours(0, 0, 0, 0); start.setDate(end.getDate() - 6);
        buckets.push({ label: `Sem ${4 - w} (${start.getDate()}/${start.getMonth() + 1})`, match: iso => { const t = new Date(iso).getTime(); return t >= start.getTime() && t <= end.getTime(); }, inTotal: 0, outTotal: 0 });
      }
    } else if (period === 'mensal') {
      const mNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      for (let m = 5; m >= 0; m--) {
        const d = new Date(now.getFullYear(), now.getMonth() - m, 1);
        const y = d.getFullYear(), mo = d.getMonth();
        buckets.push({ label: `${mNames[mo]}/${String(y).slice(-2)}`, match: iso => { const dt = new Date(iso); return dt.getFullYear() === y && dt.getMonth() === mo; }, inTotal: 0, outTotal: 0 });
      }
    } else {
      for (let yOff = 2; yOff >= 0; yOff--) {
        const y = now.getFullYear() - yOff;
        buckets.push({ label: String(y), match: iso => new Date(iso).getFullYear() === y, inTotal: 0, outTotal: 0 });
      }
    }

    let periodSalesCount = 0;
    STATE.sales.forEach(s => {
      const b = buckets.find(bk => bk.match(s.created_at));
      if (b) { b.inTotal += Number(s.total) || 0; periodSalesCount++; }
    });
    STATE.expenses.forEach(ex => {
      const b = buckets.find(bk => bk.match(ex.created_at));
      if (b) b.outTotal += Number(ex.amount) || 0;
    });

    const totalIn = buckets.reduce((a, b) => a + b.inTotal, 0);
    const totalOut = buckets.reduce((a, b) => a + b.outTotal, 0);
    return { buckets, totalIn, totalOut, net: totalIn - totalOut, periodSalesCount };
  }

  window.setDashboardPeriod = p => { DASHBOARD_PERIOD = p; renderMain(); };

  function renderModernBarChartSVG(buckets) {
    const maxVal = Math.max(100, ...buckets.map(b => Math.max(b.inTotal, b.outTotal)));
    const width = Math.max(540, buckets.length * 92), height = 250, padL = 56, padR = 20, padT = 20, padB = 42;
    const chartW = width - padL - padR, chartH = height - padT - padB;
    const groupW = chartW / buckets.length, barW = Math.min(26, groupW * 0.3);

    let gridSVG = '';
    for (let i = 0; i <= 4; i++) {
      const y = padT + (chartH / 4) * i, val = maxVal * (1 - i / 4);
      gridSVG += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3" /><text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--text-muted)">${val >= 1000 ? (val / 1000).toFixed(1) + 'k' : Math.round(val)}</text>`;
    }
    let barsSVG = '';
    buckets.forEach((b, idx) => {
      const cx = padL + groupW * idx + groupW / 2;
      const hIn = (b.inTotal / maxVal) * chartH, hOut = (b.outTotal / maxVal) * chartH;
      barsSVG += `
        <g>
          <rect x="${cx - barW - 3}" y="${padT + chartH - hIn}" width="${barW}" height="${Math.max(2, hIn)}" rx="5" fill="var(--blue)"><title>Entrada (${escapeHTML(b.label)}): ${formatBRL(b.inTotal)}</title></rect>
          <rect x="${cx + 3}" y="${padT + chartH - hOut}" width="${barW}" height="${Math.max(2, hOut)}" rx="5" fill="var(--red)"><title>Saída (${escapeHTML(b.label)}): ${formatBRL(b.outTotal)}</title></rect>
          <text x="${cx}" y="${height - 16}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--text-secondary)">${escapeHTML(b.label)}</text>
        </g>`;
    });
    return `<div class="chart-box"><svg viewBox="0 0 ${width} ${height}" style="width:100%; min-width:500px; height:auto; display:block;">${gridSVG}${barsSVG}</svg></div>`;
  }

  function renderDashboardView() {
    const stats = buildFinancialSeries(DASHBOARD_PERIOD);
    const ticket = stats.periodSalesCount ? stats.totalIn / stats.periodSalesCount : 0;
    const now = new Date(), todayKey = now.toISOString().slice(0, 10);
    const sumP = (list, field, fn) => list.filter(fn).reduce((s, x) => s + (Number(x[field]) || 0), 0);

    const inToday = sumP(STATE.sales, 'total', s => s.created_at.slice(0, 10) === todayKey);
    const outToday = sumP(STATE.expenses, 'amount', e => e.created_at.slice(0, 10) === todayKey);
    const inWeek = sumP(STATE.sales, 'total', s => (now - new Date(s.created_at)) <= 7 * 86400000);
    const outWeek = sumP(STATE.expenses, 'amount', e => (now - new Date(e.created_at)) <= 7 * 86400000);
    const inMonth = sumP(STATE.sales, 'total', s => { const d = new Date(s.created_at); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
    const outMonth = sumP(STATE.expenses, 'amount', e => { const d = new Date(e.created_at); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
    const inYear = sumP(STATE.sales, 'total', s => new Date(s.created_at).getFullYear() === now.getFullYear());
    const outYear = sumP(STATE.expenses, 'amount', e => new Date(e.created_at).getFullYear() === now.getFullYear());

    const payMap = {};
    STATE.sales.forEach(s => { payMap[s.payment_method] = (payMap[s.payment_method] || 0) + Number(s.total); });
    const payTotal = Object.values(payMap).reduce((a, b) => a + b, 0) || 1;

    const prodQty = {};
    STATE.sales.forEach(s => (s.items || []).forEach(it => {
      if (!prodQty[it.name]) prodQty[it.name] = { qty: 0, rev: 0 };
      prodQty[it.name].qty += it.qty;
      prodQty[it.name].rev += it.qty * it.unitPrice;
    }));
    const topProducts = Object.entries(prodQty).sort((a, b) => b[1].rev - a[1].rev).slice(0, 5);

    return `

        </div>
        ${CURRENT_USER.role === 'admin' ? `<button class="btn btn-danger btn-sm" onclick="switchTab('expenses')">+ Registrar Saída de Dinheiro</button>` : ''}
      </div>

      <div class="grid-kpi">
        <div class="card"><div class="text-muted" style="font-size:12px;font-weight:600;">ENTRADAS (${DASHBOARD_PERIOD.toUpperCase()})</div><div class="text-blue fw-700" style="font-size:24px;margin-top:6px;">${formatBRL(stats.totalIn)}</div><div class="text-muted" style="font-size:12px;">${stats.periodSalesCount} vendas</div></div>
        <div class="card"><div class="text-muted" style="font-size:12px;font-weight:600;">SAÍDAS (${DASHBOARD_PERIOD.toUpperCase()})</div><div class="text-red fw-700" style="font-size:24px;margin-top:6px;">${formatBRL(stats.totalOut)}</div><div class="text-muted" style="font-size:12px;">Despesas / Retiradas</div></div>
        <div class="card"><div class="text-muted" style="font-size:12px;font-weight:600;">SALDO LÍQUIDO</div><div class="${stats.net>=0?'text-blue':'text-red'} fw-700" style="font-size:24px;margin-top:6px;">${formatBRL(stats.net)}</div><div class="text-muted" style="font-size:12px;">Entradas - Saídas</div></div>
        <div class="card"><div class="text-muted" style="font-size:12px;font-weight:600;">TICKET MÉDIO</div><div class="fw-700" style="font-size:24px;margin-top:6px;">${formatBRL(ticket)}</div><div class="text-muted" style="font-size:12px;">Média por venda</div></div>
      </div>

      <div class="card" style="margin-bottom:18px;">
        <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;">
          <div><h3 style="font-size:16px;font-weight:700;">Fluxo de Caixa: Entradas vs. Saídas (${DASHBOARD_PERIOD})</h3></div>

    return `
      <div class="grid-2" style="align-items:start;">
        <div class="card">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">Registrar Saída de Dinheiro</h3>

            <div class="grid-2">
              <div class="form-group"><label class="form-label">Valor (R$)*</label><input class="input" id="exp-amount" type="number" step="0.01" min="0.01" max="999999" required /></div>
              <div class="form-group"><label class="form-label">Categoria*</label><select class="select" id="exp-cat"><option>Fornecedores</option><option>Infraestrutura / Aluguel</option><option>Energia / Internet</option><option>Logística / Frete</option><option>Salários / Pró-labore</option><option>Impostos / Taxas</option><option>Outros</option></select></div>

              <div class="form-group"><label class="form-label">Forma de Pagamento</label><select class="select" id="exp-pay"><option>Pix</option><option>Dinheiro (Caixa)</option><option>Débito</option><option>Crédito</option><option>Boleto / Transferência</option></select></div>
              <div class="form-group"><label class="form-label">Observação</label><input class="input" id="exp-notes" maxlength="140" /></div>
            </div>
            <button class="btn btn-danger w-full" type="submit">Confirmar Saída Financeira</button>
          </form>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="font-size:16px;font-weight:700;">Histórico de Saídas</h3><span class="badge badge-red">Total: ${formatBRL(totalOut)}</span></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Data</th><th>Para onde foi</th><th>Categoria</th><th>Valor</th><th></th></tr></thead>
              <tbody>
                ${STATE.expenses.length === 0 ? '<tr><td colspan="5" class="text-muted">Nenhuma saída registrada.</td></tr>' : STATE.expenses.map(ex => `
                  <tr>
                    <td style="font-size:12px;">${formatDateTime(ex.created_at)}</td>
                    <td><div class="fw-600">${escapeHTML(ex.destination)}</div><div class="text-muted" style="font-size:11.5px;">${escapeHTML(ex.payment_method)}${ex.notes ? ' • ' + escapeHTML(ex.notes) : ''}</div></td>
                    <td><span class="badge">${escapeHTML(ex.category)}</span></td>
                    <td class="text-red fw-700">-${formatBRL(ex.amount)}</td>
                    <td><button class="btn btn-sm btn-ghost text-red" onclick="deleteExpense('${ex.id}')">Excluir</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  }

  window.handleAddExpense = async function (e) {
    e.preventDefault();
    const destination = document.getElementById('exp-dest').value.trim();
    const amount = clampMoney(document.getElementById('exp-amount').value);
    const category = document.getElementById('exp-cat').value;
    const payment_method = document.getElementById('exp-pay').value;
    const notes = document.getElementById('exp-notes').value.trim();
    if (!destination || !Number.isFinite(amount) || amount <= 0) return toast('Dados inválidos.', 'error');

    const { error } = await sb.from('expenses').insert({
      destination, amount, category, payment_method, notes,
      user_id: CURRENT_USER.id, user_name: CURRENT_USER.name
    });
    if (error) return toast('Erro ao salvar saída: ' + error.message, 'error');
    await logAuditRemote('SAIDA_FINANCEIRA', `Saída de ${formatBRL(amount)} para "${destination}"`, 'warn');
    toast('Saída financeira salva na nuvem!');
    await syncAllData(false);
  };

  window.deleteExpense = async function (id) {
    if (!confirm('Remover este registro de saída?')) return;
    const { error } = await sb.from('expenses').delete().eq('id', id);
    if (error) return toast('Erro ao excluir: ' + error.message, 'error');
    await logAuditRemote('SAIDA_REMOVIDA', `Saída ${id} removida.`, 'warn');
    await syncAllData(false);
  };

  /* =========================================================
     ERP - ESTOQUE
     ========================================================= */
  function renderERPView() {
    const lowCount = STATE.products.filter(p => p.stock <= p.min_stock).length;

    return `
      <div class="grid-kpi">
        <div class="card"><div class="text-muted" style="font-size:12px;">ITENS NO CATÁLOGO</div><div class="fw-700" style="font-size:22px;margin-top:4px;">${STATE.products.length}</div></div>
        <div class="card"><div class="text-muted" style="font-size:12px;">ESTOQUE BAIXO / ZERADO</div><div class="text-red fw-700" style="font-size:22px;margin-top:4px;">${lowCount}</div></div>
        <div class="card"><div class="text-muted" style="font-size:12px;">VALOR EM ESTOQUE</div><div class="text-blue fw-700" style="font-size:22px;margin-top:4px;">${formatBRL(totalVal)}</div></div>

    `;

  function buildERPTableHTML() {
    const q = ERP_SEARCH.trim().toLowerCase();

    return `
      <table>

          ${list.length === 0 ? '<tr><td colspan="6" class="text-muted">Nenhum produto encontrado.</td></tr>' : list.map(p => `
            <tr>
              <td class="font-mono" style="font-size:12px;">${escapeHTML(p.sku)}</td>
              <td class="fw-600">${escapeHTML(p.name)}</td>

                <div style="display:flex;align-items:center;gap:6px;">

        </tbody>
      </table>
    `;
  }
  window.updateERPTable = () => { const el = document.getElementById('erp-table-wrap'); if (el) el.innerHTML = buildERPTableHTML(); };

  window.adjustStock = async function (id, delta) {
    const p = STATE.products.find(x => x.id === id);
    if (!p) return;
    const next = Math.max(0, p.stock + delta);
    const { error } = await sb.from('products').update({ stock: next }).eq('id', id);
    if (error) return toast('Erro ao atualizar estoque: ' + error.message, 'error');
    p.stock = next;
    await logAuditRemote('ESTOQUE_AJUSTADO', `${p.name} -> ${next} un.`, 'info');
    updateERPTable();
  };

  window.openProductModal = function (id = null) {
    const p = id ? STATE.products.find(x => x.id === id) : { sku: '', name: '', category: 'Hardware', cost_price: 0, price: '', stock: 1, min_stock: 5 };
    openModal(`
      <h3 style="font-size:17px;font-weight:700;margin-bottom:14px;">${id ? 'Editar Produto' : 'Novo Produto no ERP'}</h3>

          <div class="form-group"><label class="form-label">Preço Venda (R$)*</label><input class="input" id="mp-price" type="number" step="0.01" min="0.01" required value="${p.price}" /></div>

        </div>
      </form>
    `);

  window.saveProduct = async function (e, id) {
    e.preventDefault();
    const payload = {
      sku: document.getElementById('mp-sku').value.trim().toUpperCase(),
      category: document.getElementById('mp-cat').value.trim(),
      name: document.getElementById('mp-name').value.trim(),
      cost_price: clampMoney(document.getElementById('mp-cost').value) || 0,
      price: clampMoney(document.getElementById('mp-price').value),
      stock: parseInt(document.getElementById('mp-stock').value, 10),
      min_stock: parseInt(document.getElementById('mp-min').value, 10) || 0
    };
    if (!payload.sku || !payload.name || !Number.isFinite(payload.price) || payload.price <= 0 || payload.stock < 0) return toast('Dados inválidos.', 'error');

    const res = id ? await sb.from('products').update(payload).eq('id', id) : await sb.from('products').insert(payload);
    if (res.error) return toast('Erro ao salvar: ' + res.error.message, 'error');
    await logAuditRemote(id ? 'PRODUTO_EDITADO' : 'PRODUTO_CRIADO', payload.name, 'info');
    closeModal(); toast('Produto salvo no banco!');
    await syncAllData(false);
  };

  window.deleteProduct = async function (id) {
    const p = STATE.products.find(x => x.id === id);
    if (!p || !confirm(`Excluir "${p.name}"?`)) return;
    const { error } = await sb.from('products').delete().eq('id', id);
    if (error) return toast('Erro ao excluir: ' + error.message, 'error');
    await logAuditRemote('PRODUTO_EXCLUIDO', p.name, 'warn');
    await syncAllData(false);
  };

  window.addDebt = async function (e, cid) {
    e.preventDefault();
    const description = document.getElementById('nd-desc').value.trim();
    const amount = clampMoney(document.getElementById('nd-amount').value);
    const due_date = document.getElementById('nd-due').value;
    const { error } = await sb.from('debts').insert({ customer_id: cid, description, amount, due_date, status: 'open' });
    if (error) return toast('Erro: ' + error.message, 'error');
    await logAuditRemote('DIVIDA_REGISTRADA', `${description} (${formatBRL(amount)})`, 'info');
    await syncAllData(false);
    openCustomerDetail(cid);
  };

  window.markDebtPaid = async function (debtId, reopenCid = null) {
    const { error } = await sb.from('debts').update({ status: 'paid', paid_at: new Date().toISOString() }).eq('id', debtId);
    if (error) return toast('Erro: ' + error.message, 'error');
    await logAuditRemote('DIVIDA_QUITADA', `Dívida ${debtId} quitada.`, 'info');
    toast('Cobrança quitada!');
    await syncAllData(false);
    if (reopenCid) openCustomerDetail(reopenCid);
  };

  window.addInteraction = async function (e, cid) {
    e.preventDefault();
    const text = document.getElementById('ni-text').value.trim();
    const c = STATE.customers.find(x => x.id === cid);
    if (!c || !text) return;
    const next = [{ date: new Date().toISOString(), text }, ...(c.interactions || [])];
    const { error } = await sb.from('customers').update({ interactions: next }).eq('id', cid);
    if (error) return toast('Erro: ' + error.message, 'error');
    c.interactions = next;
    openCustomerDetail(cid);
  };

  window.copyCollectionMsg = function (debtId) {
    const d = STATE.debts.find(x => x.id === debtId);
    const c = STATE.customers.find(x => x.id === d?.customer_id);
    if (!d || !c) return;
    const msg = `Olá, ${c.name}! Aqui é da Code_in_tech. Lembrete da pendência "${d.description}" (${formatBRL(d.amount)}), vencimento ${formatDate(d.due_date)}.`;
    navigator.clipboard?.writeText(msg).then(() => toast('Mensagem copiada!')).catch(() => alert(msg));
  };

    return `

            <table>
              <thead><tr><th>Nome / E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead>

                ${STATE.users.map(u => `
                  <tr>
                    <td><div class="fw-600">${escapeHTML(u.name)}</div><div class="text-muted" style="font-size:12px;">${escapeHTML(u.email)}</div></td>

                    <td><span class="badge ${u.active ? 'badge-blue' : 'badge-red'}">${u.active ? 'Ativo' : 'Bloqueado'}</span></td>
                    <td>${u.id === CURRENT_USER.id ? '<span class="text-muted" style="font-size:12px;">Você</span>' : `
                      <div style="display:flex;gap:6px;">
                        <button class="btn btn-sm" onclick="toggleUserActive('${u.id}', ${!u.active})">${u.active ? 'Bloquear' : 'Ativar'}</button>

                `).join('')}

            </table>
          </div>
        </div>

    `;

  window.createOperator = async function (e) {
    e.preventDefault();
    const name = document.getElementById('nu-name').value.trim();
    const email = document.getElementById('nu-email').value.trim().toLowerCase();
    const password = document.getElementById('nu-pass').value;
    const role = document.getElementById('nu-role').value;

    if (CURRENT_USER.role !== 'admin' && !['caixa', 'erp', 'crm'].includes(role)) return toast('Sem permissão.', 'error');
    if (!validateEmail(email) || password.length < 6) return toast('E-mail ou senha inválidos.', 'error');

    const btn = document.getElementById('btn-create-op');
    btn.disabled = true; btn.textContent = 'Criando...';

    // Cliente efêmero não sobrescreve a sessão do Admin/Gestor atual!
    const cfg = getSupabaseConfig();
    const tempSb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: false, autoRefreshToken: false } });
    const { data, error } = await tempSb.auth.signUp({ email, password, options: { data: { name } } });

    if (error || !data.user) {
      btn.disabled = false; btn.textContent = 'Criar Credencial na Nuvem';
      return toast('Erro ao criar usuário: ' + (error?.message || 'Verifique se e-mail já existe.'), 'error');
    }

    // Atualiza papel definitivo usando o token do Admin/Gestor (validado por RLS)
    const { error: updErr } = await sb.from('profiles').update({ role, name }).eq('id', data.user.id);
    btn.disabled = false; btn.textContent = 'Criar Credencial na Nuvem';

    if (updErr) return toast('Usuário criado, mas erro ao definir perfil: ' + updErr.message, 'error');
    await logAuditRemote('USUARIO_CRIADO', `${email} (${role})`, 'info');
    toast('Credencial criada no Supabase!');
    await syncAllData(false);
  };

  window.toggleUserActive = async function (id, nextActive) {
    const { error } = await sb.from('profiles').update({ active: nextActive }).eq('id', id);
    if (error) return toast('Erro: ' + error.message, 'error');
    await logAuditRemote('USUARIO_STATUS', `Usuário ${id} -> ${nextActive ? 'ativo' : 'bloqueado'}`, 'warn');
    await syncAllData(false);
  };

          <input class="input" placeholder="Buscar peça ou SKU..." value="${escapeHTML(PDV_STATE.searchProduct)}" oninput="PDV_STATE.searchProduct=this.value; updatePDVProducts()" />

  function buildPDVProductsHTML() {
    const q = PDV_STATE.searchProduct.trim().toLowerCase();
    const list = STATE.products.filter(p => !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
    if (list.length === 0) return '<p class="text-muted">Nenhum produto encontrado.</p>';
    return list.map(p => `
      <button class="product-tile" type="button" ${p.stock <= 0 ? 'disabled' : ''} onclick="addToCart('${p.id}')">
        <div><div style="font-size:11px;" class="font-mono text-muted">${escapeHTML(p.sku)}</div><div class="fw-600" style="font-size:13.5px;margin-top:2px;">${escapeHTML(p.name)}</div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
          <span class="fw-700 text-blue">${formatBRL(p.price)}</span>
          <span class="badge ${p.stock <= p.min_stock ? 'badge-red' : ''}">${p.stock <= 0 ? 'Sem estoque' : p.stock + ' un.'}</span>
        </div>
      </button>
    `).join('');
  }

  function calcCartTotals() {
    const subtotal = PDV_STATE.cart.reduce((s, it) => s + it.unitPrice * it.qty, 0);
    const discount = Math.max(0, Math.min(subtotal, Number(PDV_STATE.discount) || 0));
    const total = Math.max(0, Math.round((subtotal - discount) * 100) / 100);
    return { subtotal, discount, total };
  }

  function buildPDVCartHTML() {
    const { subtotal, total } = calcCartTotals();
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="font-size:16px;font-weight:700;">Venda Atual</h3>
        ${PDV_STATE.cart.length > 0 ? `<button class="btn btn-sm btn-ghost text-red" onclick="clearCart()">Limpar</button>` : ''}
      </div>
      ${PDV_STATE.cart.length === 0 ? '<p class="text-muted" style="padding:22px 0;text-align:center;">Selecione produtos para vender.</p>' : `
        <div>
          ${PDV_STATE.cart.map((it, idx) => {
            const edited = Math.abs(it.unitPrice - it.tablePrice) > 0.001;
            return `<div class="cart-item">
              <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:8px;">
                <div class="fw-600" style="font-size:13.5px;">${escapeHTML(it.name)}</div>
                <button class="btn btn-sm btn-ghost text-red" type="button" onclick="removeCartItem(${idx})">Remover</button>
              </div>
              <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <button class="btn btn-sm" type="button" onclick="changeCartQty(${idx}, -1)">−</button>
                  <span class="fw-700" style="min-width:22px;text-align:center;">${it.qty}</span>
                  <button class="btn btn-sm" type="button" onclick="changeCartQty(${idx}, 1)">+</button>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <label style="font-size:11.5px;color:var(--text-muted);">Valor unit. (R$):</label>
                  <input class="input" style="width:98px;min-height:34px;padding:4px 8px;font-weight:700;" type="number" step="0.01" min="0.01" max="99999" value="${it.unitPrice}" oninput="updateCartUnitPriceLive(${idx}, this.value)" onblur="refreshCartUI()" />
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:12.5px;">
                <span id="cart-edited-tag-${idx}" class="${edited ? 'text-red fw-600' : 'text-muted'}">${edited ? `Valor editado (Tabela: ${formatBRL(it.tablePrice)})` : `Tabela: ${formatBRL(it.tablePrice)}`}</span>
                <span class="fw-700 text-blue" id="cart-line-sub-${idx}">${formatBRL(it.unitPrice * it.qty)}</span>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:10px;">
          <div class="grid-2">
            <div class="form-group"><label class="form-label">Desconto geral (R$)</label><input class="input" type="number" step="0.01" min="0" value="${PDV_STATE.discount}" oninput="PDV_STATE.discount=clampMoney(this.value)||0; updateCartTotalsLive()" /></div>
            <div class="form-group"><label class="form-label">Pagamento</label><select class="select" onchange="PDV_STATE.paymentMethod=this.value">${['Pix', 'Dinheiro', 'Débito', 'Crédito', 'Fiado'].map(m => `<option value="${m}" ${PDV_STATE.paymentMethod===m?'selected':''}>${m}</option>`).join('')}</select></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);margin-bottom:4px;"><span>Subtotal</span><span id="pdv-subtotal-el">${formatBRL(subtotal)}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:14px;"><span>Total</span><span class="text-blue" id="pdv-total-el">${formatBRL(total)}</span></div>
          <button class="btn btn-primary w-full" type="button" id="btn-finalize-sale" onclick="finalizeSale()">Finalizar Venda</button>
        </div>
      `}
    `;
  }

  function buildMobilePDVBarHTML() {
    const { total } = calcCartTotals();
    return `<div><div class="text-muted" style="font-size:11px;">TOTAL (${PDV_STATE.cart.length} itens)</div><div class="fw-700 text-blue" style="font-size:18px;" id="pdv-mobile-total">${formatBRL(total)}</div></div><div style="display:flex;gap:8px;"><button class="btn btn-sm" onclick="document.getElementById('pdv-cart-section').scrollIntoView({behavior:'smooth'})">Ver Venda</button><button class="btn btn-sm btn-primary" ${PDV_STATE.cart.length===0?'disabled':''} onclick="finalizeSale()">Finalizar</button></div>`;
  }

  window.updatePDVProducts = () => { const el = document.getElementById('pdv-products-grid'); if (el) el.innerHTML = buildPDVProductsHTML(); };
  window.refreshCartUI = () => {
    const c = document.getElementById('pdv-cart-section'), m = document.getElementById('mobile-pdv-bar');
    if (c) c.innerHTML = buildPDVCartHTML();
    if (m) m.innerHTML = buildMobilePDVBarHTML();
  };

  window.addToCart = function (pid) {
    const p = STATE.products.find(x => x.id === pid);
    if (!p || p.stock <= 0) return toast('Sem estoque!', 'error');
    const ex = PDV_STATE.cart.find(c => c.productId === pid);
    if (ex) {
      if (ex.qty + 1 > p.stock) return toast(`Máximo em estoque: ${p.stock}`, 'error');
      ex.qty++;
    } else {
      PDV_STATE.cart.push({ productId: p.id, name: p.name, tablePrice: Number(p.price), unitPrice: Number(p.price), qty: 1, maxStock: p.stock });
    }
    refreshCartUI();
  };
  window.changeCartQty = (idx, d) => {
    const it = PDV_STATE.cart[idx]; if (!it) return;
    const p = STATE.products.find(x => x.id === it.productId);
    const max = p ? p.stock : it.maxStock;
    if (it.qty + d <= 0) PDV_STATE.cart.splice(idx, 1);
    else if (it.qty + d > max) return toast(`Disponível: ${max}`, 'error');
    else it.qty += d;
    refreshCartUI();
  };
  window.removeCartItem = idx => { PDV_STATE.cart.splice(idx, 1); refreshCartUI(); };
  window.clearCart = () => { PDV_STATE.cart = []; PDV_STATE.discount = 0; refreshCartUI(); };
  window.updateCartUnitPriceLive = function (idx, raw) {
    const it = PDV_STATE.cart[idx], val = clampMoney(raw);
    if (!it || !Number.isFinite(val) || val <= 0 || val > 99999) return;
    it.unitPrice = val;
    const sEl = document.getElementById(`cart-line-sub-${idx}`); if (sEl) sEl.textContent = formatBRL(it.unitPrice * it.qty);
    const tEl = document.getElementById(`cart-edited-tag-${idx}`);
    if (tEl) {
      const ed = Math.abs(it.unitPrice - it.tablePrice) > 0.001;
      tEl.className = ed ? 'text-red fw-600' : 'text-muted';
      tEl.textContent = ed ? `Valor editado (Tabela: ${formatBRL(it.tablePrice)})` : `Tabela: ${formatBRL(it.tablePrice)}`;
    }
    updateCartTotalsLive();
  };
  window.updateCartTotalsLive = function () {
    const { subtotal, total } = calcCartTotals();
    const s = document.getElementById('pdv-subtotal-el'), t = document.getElementById('pdv-total-el'), m = document.getElementById('pdv-mobile-total');
    if (s) s.textContent = formatBRL(subtotal);
    if (t) t.textContent = formatBRL(total);
    if (m) m.textContent = formatBRL(total);
  };

  window.finalizeSale = async function () {
    if (PDV_STATE.cart.length === 0) return toast('Carrinho vazio.', 'error');
    const { total, discount } = calcCartTotals();
    if (total <= 0) return toast('Total não pode ficar zerado.', 'error');
    if (PDV_STATE.paymentMethod === 'Fiado' && !PDV_STATE.customerId) return toast('Selecione um cliente para Fiado.', 'error');

    const btn = document.getElementById('btn-finalize-sale');
    if (btn) { btn.disabled = true; btn.textContent = 'Processando...'; }

    const { data, error } = await sb.rpc('finalize_pdv_sale', {
      p_customer_id: PDV_STATE.customerId || null,
      p_payment_method: PDV_STATE.paymentMethod,
      p_discount: discount,
      p_items: PDV_STATE.cart.map(i => ({ product_id: i.productId, qty: i.qty, unit_price: i.unitPrice }))
    });

    if (btn) { btn.disabled = false; btn.textContent = 'Finalizar Venda'; }
    if (error) return toast('Erro ao finalizar venda: ' + error.message, 'error');

    toast(`Venda concluída! Total: ${formatBRL(data.total)}`);
    PDV_STATE.cart = []; PDV_STATE.discount = 0; PDV_STATE.customerId = '';
    await syncAllData(false);
  };

  /* ---- RELATÓRIO DE VENDAS & PDF ---- */
  function getFilteredPDVSales() {
    const now = new Date(), todayStr = now.toISOString().slice(0, 10);
    return STATE.sales.filter(s => {
      if (PDV_STATE.reportPayment !== 'all' && s.payment_method !== PDV_STATE.reportPayment) return false;
      const d = new Date(s.created_at);
      if (PDV_STATE.reportFilter === 'today') return s.created_at.slice(0, 10) === todayStr;
      if (PDV_STATE.reportFilter === '7d') return (now - d) <= 7 * 86400000;
      if (PDV_STATE.reportFilter === '30d') return (now - d) <= 30 * 86400000;
      return true;
    });
  }

  function renderPDVReportView() {
    const sales = getFilteredPDVSales();
    const totalSum = sales.reduce((s, x) => s + Number(x.total), 0);
    return `
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
          <div style="display:flex;flex-wrap:wrap;gap:10px;">
            <select class="select" style="width:auto;" onchange="PDV_STATE.reportFilter=this.value; renderMain()">
              <option value="today" ${PDV_STATE.reportFilter==='today'?'selected':''}>Vendas de Hoje</option>
              <option value="7d" ${PDV_STATE.reportFilter==='7d'?'selected':''}>Últimos 7 dias</option>
              <option value="30d" ${PDV_STATE.reportFilter==='30d'?'selected':''}>Últimos 30 dias</option>
              <option value="all" ${PDV_STATE.reportFilter==='all'?'selected':''}>Todo o Histórico</option>
            </select>
            <select class="select" style="width:auto;" onchange="PDV_STATE.reportPayment=this.value; renderMain()">
              <option value="all" ${PDV_STATE.reportPayment==='all'?'selected':''}>Todas Formas</option>
              ${['Pix', 'Dinheiro', 'Débito', 'Crédito', 'Fiado'].map(m => `<option value="${m}" ${PDV_STATE.reportPayment===m?'selected':''}>${m}</option>`).join('')}
            </select>
          </div>
          <button class="btn btn-primary" onclick="exportSalesPDF()">Exportar Relatório em PDF</button>
        </div>
      </div>

      <div class="grid-kpi">
        <div class="card"><div class="text-muted" style="font-size:12px;">QTD. VENDAS</div><div class="fw-700" style="font-size:22px;margin-top:4px;">${sales.length}</div></div>
        <div class="card"><div class="text-muted" style="font-size:12px;">TOTAL VENDIDO</div><div class="text-blue fw-700" style="font-size:22px;margin-top:4px;">${formatBRL(totalSum)}</div></div>
        <div class="card"><div class="text-muted" style="font-size:12px;">TICKET MÉDIO</div><div class="fw-700" style="font-size:22px;margin-top:4px;">${formatBRL(sales.length ? totalSum / sales.length : 0)}</div></div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Data/Hora</th><th>Cliente</th><th>Itens</th><th>Pagamento</th><th>Total</th></tr></thead>
            <tbody>
              ${sales.length === 0 ? '<tr><td colspan="5" class="text-muted">Nenhuma venda para este filtro.</td></tr>' : sales.map(s => `
                <tr>
                  <td style="font-size:12px;">${formatDateTime(s.created_at)}</td>
                  <td class="fw-600">${escapeHTML(s.customer_name)}</td>
                  <td style="font-size:12.5px;">${(s.items || []).map(i => `${i.qty}x ${escapeHTML(i.name)} (${formatBRL(i.unitPrice)})${i.edited ? ' <span class="badge badge-red">Editado</span>' : ''}`).join('<br>')}</td>
                  <td><span class="badge">${escapeHTML(s.payment_method)}</span></td>
                  <td class="fw-700 text-blue">${formatBRL(s.total)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.exportSalesPDF = async function () {
    const sales = getFilteredPDVSales();
    const totalSum = sales.reduce((s, x) => s + Number(x.total), 0);
    const byPay = {};
    sales.forEach(s => { byPay[s.payment_method] = (byPay[s.payment_method] || 0) + Number(s.total); });
    const periodNames = { today: 'Hoje', '7d': 'Últimos 7 dias', '30d': 'Últimos 30 dias', all: 'Todo o Histórico' };

    document.getElementById('print-area').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #09090B;padding-bottom:12px;margin-bottom:16px;">
        <div><h1 style="font-size:20px;margin:0;">Code_in_tech — Soluções em T.I.</h1><div style="font-size:13px;color:#52525B;">Relatório Oficial de Vendas (PDV)</div></div>
        <div style="text-align:right;font-size:12px;">
          <div><strong>Emissão:</strong> ${formatDateTime(new Date().toISOString())}</div>
          <div><strong>Operador:</strong> ${escapeHTML(CURRENT_USER.name)}</div>
          <div><strong>Filtro:</strong> ${periodNames[PDV_STATE.reportFilter]} | ${PDV_STATE.reportPayment === 'all' ? 'Todas Formas' : PDV_STATE.reportPayment}</div>
        </div>
      </div>
      <div style="display:flex;gap:20px;margin-bottom:14px;font-size:13px;">
        <div><strong>Vendas:</strong> ${sales.length}</div>
        <div><strong>Total:</strong> ${formatBRL(totalSum)}</div>
        <div><strong>Pagamentos:</strong> ${Object.entries(byPay).map(([k, v]) => `${k}: ${formatBRL(v)}`).join(' | ') || 'Sem vendas'}</div>
      </div>
      <table>
        <thead><tr><th>Data/Hora</th><th>Cliente</th><th>Itens</th><th>Pagamento</th><th>Desc.</th><th>Total</th></tr></thead>
        <tbody>
          ${sales.map(s => `<tr><td>${formatDateTime(s.created_at)}</td><td>${escapeHTML(s.customer_name)}</td><td>${(s.items || []).map(i => `${i.qty}x ${escapeHTML(i.name)} (${formatBRL(i.unitPrice)})${i.edited ? ' [Editado]' : ''}`).join('<br>')}</td><td>${escapeHTML(s.payment_method)}</td><td>${formatBRL(s.discount)}</td><td><strong>${formatBRL(s.total)}</strong></td></tr>`).join('') || '<tr><td colspan="6">Sem vendas no filtro.</td></tr>'}
        </tbody>
      </table>
    `;
    await logAuditRemote('RELATORIO_PDF_EMITIDO', `Exportado PDF (${sales.length} vendas, ${formatBRL(totalSum)})`, 'info');
    window.print();
  };

  /* =========================================================
     MODAIS & BOOT
     ========================================================= */
  function openModal(html) { document.getElementById('modal-box').innerHTML = html; document.getElementById('modal-root').classList.remove('hidden'); }
  window.closeModal = () => { document.getElementById('modal-root').classList.add('hidden'); document.getElementById('modal-box').innerHTML = ''; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  async function boot() {
    document.getElementById('login-logo-slot').innerHTML = getLogoHTML(false);
    document.getElementById('topbar-logo-slot').innerHTML = getLogoHTML(true);
    applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
    initSupabaseClient();

    if (sb) {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
        if (profile && profile.active) {
          CURRENT_USER = profile;
          await enterApp();
          return;
        }
      }
    }
    window.location.hash = '#login';
  }

  window.PDV_STATE = PDV_STATE;
  window.clampMoney = clampMoney;
  boot();
})();
</script>
</body>
</html>
